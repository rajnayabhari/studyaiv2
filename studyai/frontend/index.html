<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Study Assistant</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-container main-layout">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="logo-area">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <h2>StudyAI</h2>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept=".pdf" style="display:none">
                <button class="glass-btn upload-btn" onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Upload Document
                </button>
                <div id="uploadStatus" class="status-text"></div>
            </div>

            <div class="session-info">
                <p><i class="fa-solid fa-id-badge"></i> Session:</p>
                <code id="sessionIdDisplay">Initializing...</code>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area glass-panel">
            <header class="chat-header">
                <h3><i class="fa-solid fa-robot"></i> AI Tutor</h3>
            </header>
            
            <div class="messages-container" id="messagesContainer">
                <div class="message ai-message glass-message">
                    <div class="message-content">Hello! I'm your Intelligent Study Assistant. Upload a document to begin!</div>
                </div>
            </div>

            <div class="input-area">
                <form id="chatForm" class="chat-form">
                    <input type="text" id="userInput" placeholder="Ask a question about your documents..." autocomplete="off" required>
                    <button type="submit" class="glass-btn send-btn" id="sendBtn">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
